<div class="grid gap-3">
  <p-iconfield>
    <p-inputicon class="pi pi-user" />
    <input type="text" id="username" pInputText size="small" fluid placeholder="Enter your username" [field]="loginForm.username" />
  </p-iconfield>
  <p-iconfield>
    <p-inputicon class="pi pi-lock" />
    <p-password [field]="loginForm.password" placeholder="Enter Password" fluid [toggleMask]="true" [feedback]="false" />
  </p-iconfield>
</div>
<a routerLink="/forget-password" class="ms-auto text-sm">Forgot Password?</a>
<button pButton size="large" severity="secondary" [disabled]="loginForm().invalid()" type="submit">
  <span pButtonLabel>Submit</span>
  <i class="pi pi-send" pButtonIcon></i>
</button>
