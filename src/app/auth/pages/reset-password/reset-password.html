<app-auth-content class="mb-2">
  <ng-template #title>
    <h5 class="mb-2 text-shadow-lg/15">Time for a fresh password! 😎</h5>
  </ng-template>
  <ng-template #content>
    <p class="text-shadow-lg/15">Make it something secure and easy to remember — we'll take care of the rest.</p>
  </ng-template>
</app-auth-content>

<div class="grid gap-3 mb-3">
  <p-iconfield>
    <p-inputicon class="fa-regular fa-envelope" />
    <input type="text" id="email" pInputText size="small" fluid placeholder="Enter new password" />
  </p-iconfield>
  <p-iconfield>
    <p-inputicon class="fa-regular fa-envelope" />
    <input type="text" id="email" pInputText size="small" fluid placeholder="Confirm new password" />
  </p-iconfield>
</div>

<button pButton size="large" disabled severity="secondary" type="submit">
  <span pButtonLabel>Update Password</span>
  <i class="pi pi-send" pButtonIcon></i>
</button>
<a routerLink="/login" class="mx-auto mt-3 text-sm">
  Get back to
  <strong>Login</strong>
</a>
