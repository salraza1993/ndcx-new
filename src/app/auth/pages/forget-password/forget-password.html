<app-auth-content class="mb-2">
  <ng-template #title>
    <h6 class="mb-2 no-inehrit text-md text-shadow-lg/15">
      Forgot your password?
      <br />
      No worries!
    </h6>
  </ng-template>
  <ng-template #content>
    <p class="no-inherit text-sm text-shadow-lg/15">Enter your email and we'll send you a secure link to get you back on track 🚀</p>
  </ng-template>
</app-auth-content>

<div class="grid gap-3 mb-3">
  <p-iconfield>
    <p-inputicon class="fa-regular fa-envelope" />
    <input type="text" id="email" pInputText size="small" fluid placeholder="Enter your Reg. Email" />
  </p-iconfield>
</div>

<button pButton size="large" disabled severity="secondary" type="submit">
  <span pButtonLabel>Send Reset Link</span>
  <i class="pi pi-send" pButtonIcon></i>
</button>
<a routerLink="/login" class="mx-auto mt-3 text-sm">
  Get back to
  <strong>Login</strong>
</a>
