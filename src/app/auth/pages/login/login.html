@let userName = userInfo().firstName + ' ' + userInfo().lastName;
<app-auth-content>
  <ng-template #title>
    <h6 class="no-inehrit text-md text-shadow-lg/15 mb-2">Welcome Back, {{ userName }}! 👋</h6>
  </ng-template>
  <ng-template #content>
    <p class="no-inherit text-sm leading-1.15 block">Sign in to continue managing bookings and growing your business.</p>
  </ng-template>
</app-auth-content>

<app-login-form />
