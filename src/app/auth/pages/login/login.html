@let userName = userInfo().firstName + ' ' + userInfo().lastName;
<app-auth-content>
  <ng-template #title>
    <h5 class="mb-2">Welcome Back, {{ userName }}! 👋</h5>
  </ng-template>

  <ng-template #content>
    <p>Sign in to continue managing bookings and growing your business.</p>
  </ng-template>
</app-auth-content>
<app-login-form />
