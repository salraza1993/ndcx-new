<p-card [header]="chartHeader()">
  <div class="card flex justify-center"></div>

  <div class="border-y border-gray-200 py-1.5">
    <p-selectbutton size="small" [options]="options()" [(ngModel)]="selectedOption" optionLabel="label" optionValue="value" />
    <div class="flex justify-content-between align-items-center mb-3">
      <div>
        <span class="text-900 font-medium text-xl">8,128</span>
        <span class="text-green-500 ml-2">+5.4%</span>
      </div>
      <div class="text-600">Monthly Sales</div>
    </div>
  </div>
  <!-- <p-chart type="bar" [data]="chartData()" [options]="chartConfigs()" /> -->
</p-card>
