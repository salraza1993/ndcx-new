<app-content-wrapper size="md">
  <app-page-header [heading]="'Reports Header'">
    <ng-template #end>
      <p-button type="button" size="small" severity="secondary" label="Refresh" icon="pi pi-undo" class="surface-secondary" />
    </ng-template>
  </app-page-header>
  <div class="mb-5">
    <p-selectbutton [options]="filterOptions()" [(ngModel)]="selectedFilter" optionLabel="label" optionValue="value" />
  </div>
  <div class="grid grid-cols-2 gap-6">
    <app-sales-chart [chartData]="basicData()" />
    <p-card>
      <p>
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt
        quisquam repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
      </p>
      <p-chart type="bar" [data]="basicData()" [options]="chartConfigs()" />
    </p-card>
  </div>
</app-content-wrapper>
