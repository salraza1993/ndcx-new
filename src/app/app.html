@switch (layoutService.layoutType()) {
  @case ('authorized') {
    <app-default-layout id="default-layout">
      <router-outlet />
    </app-default-layout>
  }
  @case ('error') {
    <app-error-layout id="error-layout">
      <router-outlet />
    </app-error-layout>
  }
  @default {
    <app-auth-layout id="auth-layout">
      <router-outlet />
    </app-auth-layout>
  }
}
